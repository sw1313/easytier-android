[package]
name = "easytier-material-native"
version = "0.1.0"
edition.workspace = true

[lib]
name = "easytier_mobile"
crate-type = ["cdylib"]
path = "../../nightly/native/src/lib.rs"

[features]
default = ["custom"]
custom = []

[dependencies]
easytier = { path = "../core/easytier" }
easytier-core = { path = "../core/easytier-core", features = ["management"] }
jni = "0.21"
serde_json = "1"
anyhow = "1"
toml = "0.8.12"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = "1"
async-trait = "0.1"
url = "2"
cidr = "0.3"
