name: Publish one Android core channel

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      force:
        type: boolean
        default: false
      build_run:
        type: string
        default: ''
    secrets:
      CORE_SIGNING_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-core-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      commit: ${{ steps.check.outputs.commit }}
      reference: ${{ steps.check.outputs.reference }}
      adapter_build: ${{ steps.check.outputs.adapter_build }}
      revision: ${{ steps.check.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_CORE: ${{ inputs.force || false }}
        run: ./.github/scripts/check-core.ps1 -Channel ${{ inputs.channel }}

  build:
    needs: check
    if: needs.check.outputs.needed == 'true' && inputs.build_run == ''
    uses: ./.github/workflows/build-core.yml
    with:
      channel: ${{ inputs.channel }}
      adapter_build: ${{ needs.check.outputs.adapter_build }}
      architecture: all
      upstream_ref: ${{ needs.check.outputs.commit }}

  test:
    needs: [check, build]
    if: always() && needs.check.outputs.needed == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: jni-${{ inputs.channel }}-x86_64
          path: app/src/main/jniLibs/x86_64
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test application
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pabi=x86_64
      - name: Prepare loopback exit peer
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REFERENCE: ${{ needs.check.outputs.reference }}
          CORE_CHANNEL: ${{ inputs.channel }}
          UPSTREAM_COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          peer=$(python3 .github/scripts/prepare-peer.py "$CORE_CHANNEL" "$UPSTREAM_REFERENCE" "$UPSTREAM_COMMIT")
          "$peer" -c .github/scripts/emulator-exit.toml > .ci-peer/peer.log 2>&1 &
          echo "$!" > .ci-peer/peer.pid
          "$peer" -c .github/scripts/emulator-manual.toml > .ci-peer/manual.log 2>&1 &
          echo "$!" > .ci-peer/manual.pid
          sudo ip address add 198.18.0.1/32 dev lo
          mkdir -p .ci-peer/http
          printf 'exit-proxy-ok\n' > .ci-peer/http/exit-probe.txt
          python3 -m http.server 21130 --bind 198.18.0.1 --directory .ci-peer/http > .ci-peer/http.log 2>&1 &
          echo "$!" > .ci-peer/http.pid
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/test-core-emulator.sh
        env:
          EXPECTED_COMMIT: ${{ needs.check.outputs.commit }}
          CORE_CHANNEL: ${{ inputs.channel }}
          EXPECTED_BUILD: ${{ needs.check.outputs.adapter_build }}
      - name: Stop test peer
        if: always()
        run: |
          for pid in .ci-peer/*.pid; do
            if test -f "$pid"; then kill "$(cat "$pid")" || true; fi
          done
      - name: Report peer diagnostics
        if: failure()
        run: |
          for log in .ci-peer/peer.log .ci-peer/manual.log .ci-peer/http.log; do
            if test -f "$log"; then tail -80 "$log"; fi
          done

  publish:
    needs: [check, build, test]
    if: always() && needs.test.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: jni-${{ inputs.channel }}-*
          path: ci-artifacts
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Sign and publish verified cores
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SIGNING_PRIVATE_KEY: ${{ secrets.CORE_SIGNING_PRIVATE_KEY }}
          CORE_COMMIT: ${{ needs.check.outputs.commit }}
          ADAPTER_REVISION: ${{ needs.check.outputs.revision }}
          ADAPTER_BUILD: ${{ needs.check.outputs.adapter_build }}
        run: ./.github/scripts/publish-core.ps1 -Channel ${{ inputs.channel }}
