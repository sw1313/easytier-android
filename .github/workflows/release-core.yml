name: Update and publish Android cores

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Core update channel
        type: choice
        options: [all, stable, nightly, custom]
        default: all
      force:
        description: Rebuild even when the source has not changed
        type: boolean
        default: false
      build_run:
        description: Existing JNI build run for a single-channel recovery
        type: string
        default: ''
  push:
    paths:
      - '.github/workflows/release-core*.yml'
      - '.github/workflows/build-core.yml'
      - '.github/scripts/**'
      - 'build-native.ps1'
      - 'package-core.ps1'
      - 'publish-catalog.ps1'
      - 'native/**'
      - 'nightly/native/**'
      - 'custom/native/**'
      - 'Cargo.*'
      - 'nightly/Cargo.*'
      - 'custom/Cargo.*'

permissions:
  contents: read
  actions: read

jobs:
  channels:
    runs-on: ubuntu-latest
    outputs:
      values: ${{ steps.channels.outputs.values }}
    steps:
      - id: channels
        shell: pwsh
        env:
          CHANNEL: ${{ inputs.channel || 'all' }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          if ($env:CHANNEL -eq 'all' -and $env:BUILD_RUN) { throw 'Recovery requires one explicit channel' }
          $channels = if ($env:CHANNEL -eq 'all') { @('stable', 'nightly', 'custom') } else { @($env:CHANNEL) }
          'values=' + (ConvertTo-Json -InputObject @($channels) -Compress) >> $env:GITHUB_OUTPUT
  update:
    needs: channels
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.channels.outputs.values) }}
    uses: ./.github/workflows/release-core-channel.yml
    with:
      channel: ${{ matrix.channel }}
      force: ${{ inputs.force || false }}
      build_run: ${{ inputs.build_run || '' }}
    secrets:
      CORE_SIGNING_PRIVATE_KEY: ${{ secrets.CORE_SIGNING_PRIVATE_KEY }}
