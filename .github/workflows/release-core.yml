name: Update and publish Custom core

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the latest successful upstream source
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/release-core.yml'
      - '.github/workflows/build-core.yml'
      - '.github/scripts/**'
      - 'build-native.ps1'
      - 'package-core.ps1'
      - 'publish-catalog.ps1'
      - 'nightly/native/**'
      - 'custom/native/**'
      - 'custom/Cargo.*'

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-custom-core
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      commit: ${{ steps.check.outputs.commit }}
      upstream_run: ${{ steps.check.outputs.upstream_run }}
      revision: ${{ steps.check.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_CORE: ${{ inputs.force || false }}
        run: ./.github/scripts/check-core.ps1

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    uses: ./.github/workflows/build-core.yml
    with:
      channel: custom
      architecture: all
      upstream_ref: ${{ needs.check.outputs.commit }}

  test:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: jni-custom-x86_64
          path: app/src/main/jniLibs/x86_64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test application
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pabi=x86_64
      - name: Prepare loopback exit peer
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN: ${{ needs.check.outputs.upstream_run }}
        run: |
          mkdir -p .ci-peer
          gh run download "$UPSTREAM_RUN" --repo 225284228a-droid/EasyTier-Custom --name easytier-linux-x86_64.tar.gz --dir .ci-peer
          archive=$(find .ci-peer -name '*.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C .ci-peer
          peer=$(find .ci-peer -type f -name easytier-core -print -quit)
          test -n "$peer"
          chmod +x "$peer"
          "$peer" -c .github/scripts/emulator-exit.toml > .ci-peer/peer.log 2>&1 &
          echo "$!" > .ci-peer/peer.pid
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/test-core-emulator.sh
        env:
          EXPECTED_COMMIT: ${{ needs.check.outputs.commit }}
      - name: Stop test peer
        if: always()
        run: |
          if test -f .ci-peer/peer.pid; then kill "$(cat .ci-peer/peer.pid)" || true; fi

  publish:
    needs: [check, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: jni-custom-*
          path: ci-artifacts
      - name: Sign and publish verified cores
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SIGNING_PRIVATE_KEY: ${{ secrets.CORE_SIGNING_PRIVATE_KEY }}
          CORE_COMMIT: ${{ needs.check.outputs.commit }}
          ADAPTER_REVISION: ${{ needs.check.outputs.revision }}
        run: ./.github/scripts/publish-core.ps1
